name: 'ReadmeKit Auto-Sync & Compiler'
description: 'Compile readme-kit directives, auto-update GitHub stars and metrics, and generate adaptive vector SVG assets.'
author: 'Kazinagg'
branding:
  icon: 'layout'
  color: 'purple'

inputs:
  template:
    description: 'Path to Markdown template file'
    required: false
    default: 'README.template.md'
  output:
    description: 'Path to destination compiled Markdown file'
    required: false
    default: 'README.md'
  assets-dir:
    description: 'Folder where generated SVGs will be stored'
    required: false
    default: 'assets/generated'
  fetch-github:
    description: 'Fetch live repo stats, star trajectory and profile info via GitHub API'
    required: false
    default: 'true'
  bust-cache:
    description: 'Append content-hash parameters (?v=hash) to bypass GitHub Camo proxy caching'
    required: false
    default: 'true'
  clean-assets:
    description: 'Remove orphan/unused SVG assets'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install ReadmeKit
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install readme-kit || pip install pixel-readme-kit || pip install -e ${{ github.action_path }}

    - name: Compile and Sync Template
      shell: bash
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN || github.token }}
      run: |
        ARGS="--input ${{ inputs.template }} --output ${{ inputs.output }} --assets-dir ${{ inputs.assets-dir }}"
        if [ "${{ inputs.fetch-github }}" = "true" ]; then
          ARGS="$ARGS --fetch-github"
        fi
        if [ "${{ inputs.bust-cache }}" = "true" ]; then
          ARGS="$ARGS --bust-cache"
        fi
        if [ "${{ inputs.clean-assets }}" = "true" ]; then
          ARGS="$ARGS --clean-assets"
        fi
        readme-kit compile $ARGS || pixel-kit compile $ARGS
