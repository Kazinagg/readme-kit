  <!-- Title & Underline -->
  <text x="40" y="74" font-size="26" font-weight="700" fill="var(--primary)" class="font-sketch">COMPONENT CATALOG</text>
  <path d="M 39.3 83.86 Q 182.38 84.21 325.34 83.9" stroke="var(--accent)" stroke-width="2.0" stroke-linecap="round" fill="none" opacity="1.0" />
