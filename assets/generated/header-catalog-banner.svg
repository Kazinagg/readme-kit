<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 230" width="100%" height="100%">
  <defs>
    <style>
      
      :root {
        --bg-glass: #FDFDFD;
        --bg-panel: #F4F4F5;
        --border-chassis: #1F2937;
        --primary: #aaaaac;
        --accent: #af8e0e;
        --tertiary: #af662a;
        --title-front: #aaaaac;
        --title-mid: #666667;
        --title-dark: #333333;
        --text-main: #111827;
        --text-dim: #4B5563;
        --status: #339b59;
        --warning: #af8e0e;
        --grid-op: 0.06;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-glass: rgba(23, 25, 30, 0.94);
          --bg-panel: rgba(38, 41, 50, 0.90);
          --border-chassis: #CBD5E1;
          --primary: #f3f4f6;
          --accent: #facc15;
          --tertiary: #fb923c;
          --title-front: #f3f4f6;
          --title-mid: #6d6d6e;
          --title-dark: #242424;
          --text-main: #F8FAFC;
          --text-dim: #94A3B8;
          --status: #4ADE80;
          --warning: #FACC15;
          --grid-op: 0.06;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-glass: #FDFDFD;
          --bg-panel: #F4F4F5;
          --border-chassis: #1F2937;
          --primary: #aaaaac;
          --accent: #af8e0e;
          --tertiary: #af662a;
          --title-front: #aaaaac;
          --title-mid: #666667;
          --title-dark: #333333;
          --text-main: #111827;
          --text-dim: #4B5563;
          --status: #339b59;
          --warning: #af8e0e;
          --grid-op: 0.06;
        }
      }
      @media (hover: hover) {
        .btn-hover:hover, a:hover polygon, a:hover rect {
          filter: drop-shadow(0 0 6px var(--primary, #aaaaac));
          cursor: pointer;
          transition: filter 0.2s ease;
        }
      }


    .font-sketch { font-family: 'Virgil', 'Architects Daughter', 'Comic Shanns', 'Kalam', 'Chalkboard SE', 'Comic Sans MS', 'Casual', cursive, sans-serif; }
    .font-sketch-mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, monospace; }
    .sketch-hover { transition: opacity 0.2s ease, transform 0.2s ease; cursor: pointer; }
    .sketch-hover:hover { opacity: 0.85; transform: scale(1.01); }

    </style>
    <pattern id="headerSketch-hatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="var(--primary)" stroke-width="1.3" opacity="0.45" />
    </pattern>
    <pattern id="headerSketch-crosshatch" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="var(--accent)" stroke-width="1.2" opacity="0.4" />
      <line x1="0" y1="0" x2="12" y2="0" stroke="var(--accent)" stroke-width="1.2" opacity="0.4" />
    </pattern>
    <pattern id="headerSketch-hatch-accent" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="var(--accent)" stroke-width="1.3" opacity="0.5" />
    </pattern>
    <linearGradient id="headerSketch-tape" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.25" />
    </linearGradient>
  </defs>

